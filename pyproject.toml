[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-lights"
version = "0.0.1"
description = "Light up known radio sources; leave unexplained signals dark, untouched, and flagged for humans."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "h5py>=3.7", "hdf5plugin>=4.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
signal-lights = "signal_lights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
